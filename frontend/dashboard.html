<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — 360 Rooms</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">360 Rooms</div>
  <div class="user-info">
    <span id="welcome-text"></span>
    <button class="btn-secondary btn-sm" id="logout-btn">Log Out</button>
  </div>
</div>

<div class="container">
  <div class="section-header">
    <h2>My Spaces</h2>
    <button class="btn-secondary btn-sm" id="new-category-btn">+ Category</button>
  </div>
  <div class="chip-row" id="category-chips"></div>

  <div class="section-header">
    <h3 id="rooms-heading">My Rooms</h3>
    <button class="btn-primary" style="margin:0;width:auto" id="new-room-btn">+ Create Room</button>
  </div>

  <div class="room-grid" id="room-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">No rooms yet. Create your first room to get started.</div>
</div>

<!-- Create Room Modal -->
<div id="room-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:50;">
  <div class="card" style="max-width:420px">
    <h3>Create Room</h3>
    <label for="modal-category">Category</label>
    <select id="modal-category"></select>
    <label for="modal-room-name">Room Name</label>
    <input type="text" id="modal-room-name" placeholder="e.g. Living Room">
    <label for="modal-room-desc">Description (optional)</label>
    <textarea id="modal-room-desc" rows="2"></textarea>
    <div style="display:flex; gap:8px; margin-top:20px">
      <button class="btn-secondary" id="modal-cancel" style="flex:1">Cancel</button>
      <button class="btn-primary" id="modal-create" style="margin:0;flex:1">Create</button>
    </div>
    <div class="error-msg" id="modal-error"></div>
  </div>
</div>

<!-- New Category Modal -->
<div id="category-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:50;">
  <div class="card" style="max-width:360px">
    <h3>New Category</h3>
    <label for="new-category-name">Name</label>
    <input type="text" id="new-category-name" placeholder="e.g. Garage">
    <div style="display:flex; gap:8px; margin-top:20px">
      <button class="btn-secondary" id="category-cancel" style="flex:1">Cancel</button>
      <button class="btn-primary" id="category-create" style="margin:0;flex:1">Create</button>
    </div>
    <div class="error-msg" id="category-error"></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
