<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Rooms — Sign In</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="center-screen">
  <div class="card">
    <h1>360 Rooms</h1>
    <p class="subtitle">Turn a few phone photos into an interactive 360° view of any room.</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login" type="button">Log In</button>
      <button class="tab-btn" id="tab-register" type="button">Register</button>
    </div>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit" class="btn-primary">Log In</button>
      <div class="error-msg" id="login-error"></div>
    </form>

    <form id="register-form" style="display:none">
      <label for="reg-name">Name</label>
      <input type="text" id="reg-name" required autocomplete="name">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" required autocomplete="email">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" required autocomplete="new-password">
      <div class="hint">At least 8 characters, with letters and numbers.</div>
      <button type="submit" class="btn-primary">Create Account</button>
      <div class="error-msg" id="register-error"></div>
    </form>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
